[project]
name = "douyin-downloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "rich==13.7.0",
    "aiohttp>=3.8.0",
    "python-json-logger==2.0.7",
    "pytest==7.4.3",
    "black==23.11.0",
    "python-dateutil>=2.8.2",
    "requests-toolbelt>=1.0.0",
    # GUI相关依赖，后续开发用
    "PySide6",
    "PyQt-Fluent-Widgets[full]",
    "tqdm>=4.67.1",
    "brotli>=1.1.0",
]

[project.scripts]
douyin_downloader = "main:main"

[tool.setuptools]
packages = ["core", "gui", "apiproxy"]
package-dir = {"" = "src"}
